name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm link
      - name: aitrace runs
        shell: bash
        run: |
          aitrace --help | grep -q "aitrace who"
          aitrace agents | grep -q "instructions for AI assistants"
          test -f "$(aitrace agents --path)"
